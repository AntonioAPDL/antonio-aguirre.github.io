<!DOCTYPE html>
<html lang="en-us">
  
  {% include head.html %}

  <body class="theme-base-0b">
    <a class="skip-link" href="#main-content">Skip to content</a>

    {% include sidebar.html %}

    <!-- Wrap is the content to shift when toggling the sidebar. We wrap the
         content to avoid any CSS collisions with our real content. -->
    <div class="wrap">
      <div class="masthead">
        <div class="container">
          <p class="masthead-title">
            <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
            <small>{{ site.tagline }}</small>
          </p>
        </div>
      </div>

      <main id="main-content" class="container content" tabindex="-1">
        {{ content }}
      </main>
    </div>

    <button class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false">
      <span class="sr-only">Open navigation</span>
    </button>

    <script src="{{ site.baseurl }}/public/js/script.js" defer></script>
  </body>
</html>
