name: Verify site build

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/data/forecasts/**"
      - "climate_daily_ppt_soil.csv"
      - "climate_series_status.csv"
      - "prism_precipitation_santa_cruz_1987_2023.csv"
      - "soil_moisture_data/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  jekyll-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.4
          bundler: 2.5.23
          bundler-cache: true

      - name: Install Python check dependencies
        run: python3 -m pip install --upgrade pyyaml

      - name: Run site integrity checks
        run: python3 scripts/check_site_integrity.py

      - name: Run blog publication checks
        run: |
          python3 scripts/check_blog_quality.py
          python3 scripts/check_blog_code_blocks.py

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in public/js/*.js; do
            node --check "$file"
          done

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
